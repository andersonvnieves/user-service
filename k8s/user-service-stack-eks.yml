apiVersion: v1
kind: Namespace
metadata:
  name: fgc
---
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secrets
  namespace: fgc
type: Opaque
stringData:
  sql-password: "rohPav-juKmeb-DIhku9!"
  connection-string: "Server=users-db-service;Database=FGC_User;User Id=sa;Password=rohPav-juKmeb-DIhku9!;TrustServerCertificate=True"
  jwt-key: "8594df0eb5ecb4c96f8824462cc7d2e1885c138908f2f7b4357af54b72ab2ed6"  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fgc
data:
  jwt-issuer: fgcapi
  jwt-audience: fgcapi
  jwt-token-ttl: "10"
  root-first-name: FirstName
  root-last-name: LastName
  root-email: admin@fgc.com
  aws-sqs-user-created-queue-url: "https://sqs.us-east-1.amazonaws.com/257500279765/user-created-queue"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-db-pvc
  namespace: fgc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
  namespace: fgc
spec:
  replicas: 1
  selector:
    matchLabels: { app: users-db }
  template:
    metadata:
      labels: { app: users-db }
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2025-latest
          ports: [{ containerPort: 1433 }]
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: sql-password } }
          volumeMounts: [{ name: sql-data, mountPath: /var/opt/mssql }]
      volumes:
        - name: sql-data
          persistentVolumeClaim: { claimName: users-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: users-db-service
  namespace: fgc
spec:
  selector: { app: users-db }
  ports: [{ port: 1433, targetPort: 1433 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fgc  
spec:
  replicas: 1
  selector:
    matchLabels: { app: users-api }
  template:
    metadata:
      labels: { app: users-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando o SQL Server (1433)..."
              until nc -z -w 2 users-db-service 1433; do
                sleep 2
              done
              echo "Aguardando o RabbitMQ (5672)..."
              until nc -z -w 2 rabbitmq-service 5672; do
                sleep 2
              done
              echo "Todas as dependências estão prontas!"
      containers:
        - name: users-api
          image: 257500279765.dkr.ecr.us-east-1.amazonaws.com/fgc-user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Default
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: connection-string } }
            - name: Jwt__Issuer
              valueFrom: { configMapKeyRef: { name: users-api-config, key: jwt-issuer } }
            - name: Jwt__Audience
              valueFrom: { configMapKeyRef: { name: users-api-config, key: jwt-audience } }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: jwt-key } }
            - name: Jwt__TokenTtlInMinutes
              valueFrom: { configMapKeyRef: { name: users-api-config, key: jwt-token-ttl } }
            - name: RootUser__FirstName
              valueFrom: { configMapKeyRef: { name: users-api-config, key: root-first-name } }
            - name: RootUser__LastName
              valueFrom: { configMapKeyRef: { name: users-api-config, key: root-last-name } }
            - name: RootUser__Email
              valueFrom: { configMapKeyRef: { name: users-api-config, key: root-email } }
            - name: RootUser__Password
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: root-password } }
            - name: AwsSQS__UserCreatedQueueUrl
              valueFrom: { configMapKeyRef: { name: users-api-config, key: aws-sqs-user-created-queue-url } }
---
apiVersion: v1
kind: Service
metadata:
  name: users-api-service
  namespace: fgc  
spec:
  type: NodePort
  selector: { app: users-api }
  ports: [{ port: 80, targetPort: 8080, nodePort: 30080 }]
