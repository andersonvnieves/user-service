apiVersion: v1
kind: Namespace
metadata:
  name: fgc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users-api-secrets
  namespace: fgc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: users-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: connection-string
      remoteRef:
        key: /fgc/users/connection-string
    - secretKey: jwt-key
      remoteRef:
        key: /fgc/jwt/secret
    - secretKey: root-password
      remoteRef:
        key: /fgc/users/root-password
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /fgc/aws/access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /fgc/aws/secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users-api-config
  namespace: fgc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: users-api-config
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        jwt-issuer: "{{ .jwt_issuer }}"
        jwt-audience: "{{ .jwt_audience }}"
        jwt-token-ttl: "{{ .jwt_token_ttl }}"
        root-first-name: "{{ .root_first_name }}"
        root-last-name: "{{ .root_last_name }}"
        root-email: "{{ .root_email }}"
        aws-sqs-user-created-queue-url: "{{ .sqs_user_created_url }}"
        AWS_REGION: "{{ .aws_region }}"
  data:
    - secretKey: jwt_issuer
      remoteRef:
        key: /fgc/jwt/issuer
    - secretKey: jwt_audience
      remoteRef:
        key: /fgc/jwt/audience
    - secretKey: jwt_token_ttl
      remoteRef:
        key: /fgc/jwt/token-ttl
    - secretKey: root_first_name
      remoteRef:
        key: /fgc/users/root-first-name
    - secretKey: root_last_name
      remoteRef:
        key: /fgc/users/root-last-name
    - secretKey: root_email
      remoteRef:
        key: /fgc/users/root-email
    - secretKey: sqs_user_created_url
      remoteRef:
        key: /fgc/sqs/user-created-queue-url
    - secretKey: aws_region
      remoteRef:
        key: /fgc/aws/region
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fgc  
spec:
  replicas: 1
  selector:
    matchLabels: { app: users-api }
  template:
    metadata:
      labels: { app: users-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: users-api
          image: 230287251097.dkr.ecr.sa-east-1.amazonaws.com/fgc-user-service:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: AWS_SECRET_ACCESS_KEY } }
            - name: AWS_REGION
              valueFrom: { secretKeyRef: { name: users-api-config, key: AWS_REGION } }
            - name: ConnectionStrings__Default
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: connection-string } }
            - name: Jwt__Issuer
              valueFrom: { secretKeyRef: { name: users-api-config, key: jwt-issuer } }
            - name: Jwt__Audience
              valueFrom: { secretKeyRef: { name: users-api-config, key: jwt-audience } }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: jwt-key } }
            - name: Jwt__TokenTtlInMinutes
              valueFrom: { secretKeyRef: { name: users-api-config, key: jwt-token-ttl } }
            - name: RootUser__FirstName
              valueFrom: { secretKeyRef: { name: users-api-config, key: root-first-name } }
            - name: RootUser__LastName
              valueFrom: { secretKeyRef: { name: users-api-config, key: root-last-name } }
            - name: RootUser__Email
              valueFrom: { secretKeyRef: { name: users-api-config, key: root-email } }
            - name: RootUser__Password
              valueFrom: { secretKeyRef: { name: users-api-secrets, key: root-password } }
            - name: AwsSQS__UserCreatedQueueUrl
              valueFrom: { secretKeyRef: { name: users-api-config, key: aws-sqs-user-created-queue-url } }
---
apiVersion: v1
kind: Service
metadata:
  name: users-api-service
  namespace: fgc  
spec:
  type: ClusterIP
  selector: { app: users-api }
  ports: [{ port: 80, targetPort: 8080 }]
